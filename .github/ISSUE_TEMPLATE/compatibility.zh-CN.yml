name: 设备兼容性
description: 记录实机结果或复现设备问题
body:
  - type: markdown
    attributes:
      value: 请从日志中移除封包参数和序列号。
  - type: input
    id: hardware
    attributes:
      label: USB VID:PID
      placeholder: '1CBE:0070'
    validations:
      required: true
  - type: input
    id: firmware
    attributes:
      label: 固件版本
      description: 无法读取时请填写未知。
      placeholder: turzx_0001_0017
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Windows 版本、应用版本和入口
      placeholder: Windows 11, v0.1.0, Studio
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: 操作步骤和结果
      description: 请写明方向、前景来源、视频背景、预期结果和实体屏表现。
    validations:
      required: true
