name: Device compatibility
description: Share on-device results or reproduce a device issue
body:
  - type: markdown
    attributes:
      value: Remove packet keys and serial numbers from logs.
  - type: input
    id: hardware
    attributes:
      label: USB VID:PID
      placeholder: '1CBE:0070'
    validations:
      required: true
  - type: input
    id: firmware
    attributes:
      label: Firmware version
      description: Enter unknown if the firmware could not be read.
      placeholder: turzx_0001_0017
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Windows version, app version and entry point
      placeholder: Windows 11, v0.1.0, Studio
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps and results
      description: Include rotation, foreground source, video background, expected result and physical output.
    validations:
      required: true
