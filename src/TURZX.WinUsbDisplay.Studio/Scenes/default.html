<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TURZX Studio</title>
  <link rel="stylesheet" href="scene.css">
  <style>
    body { display: grid; place-items: center; }
    main { width: min(88vw, 106vh); padding: 6vmin 4vmin; text-align: center; }
    canvas { width: 100%; height: auto; aspect-ratio: 2.4; image-rendering: pixelated; }
    h1 { margin: 3vmin 0 1.5vmin; font-size: 10vmin; letter-spacing: -.06em; line-height: 1; }
    time { color: #b7f9d2; font: 600 4vmin var(--mono); letter-spacing: .16em; }
  </style>
</head>
<body>
  <main class="cabinet">
    <canvas width="144" height="60" aria-label="A pixel robot hops through a starfield"></canvas>
    <h1>TURZX Studio</h1>
    <time></time>
  </main>
  <script src="scene.js"></script>
  <script>
    const canvas = document.querySelector("canvas");
    const ctx = canvas.getContext("2d");
    const clock = document.querySelector("time");
    const sprite = [
      "0000110000", "0000110000", "0011111100", "0111111110", "0122112210",
      "0111111110", "0012222100", "0011111100", "0101111010", "0001001000"
    ];
    const colors = ["", "#8fffc8", "#10283a"];
    const format = new Intl.DateTimeFormat(undefined, { timeStyle: "medium" });
    let second = -1;
    // 用动画时间绘制默认场景的背景，并按秒更新时间文字。
    function render(t) {
      ctx.clearRect(0, 0, 144, 60);
      for (let i = 0; i < 30; i++) {
        const x = (i * 47 + 144 - (t * (5 + i % 3 * 9)) % 144) % 144;
        const y = 3 + i * 19 % 44;
        ctx.fillStyle = i % 5 ? "#5c79a4" : "#f4a9ff";
        ctx.fillRect(Math.floor(x), y, i % 4 ? 1 : 2, 1);
      }
      const x = 57 + Math.round(Math.sin(t * 1.3) * 11);
      const y = 14 - Math.round(Math.abs(Math.sin(t * 2.5)) * 9);
      ctx.fillStyle = "#47d9a255";
      ctx.fillRect(6, 50, 132, 1);
      for (let i = 0; i < 15; i++) {
        const tail = Math.floor((t * 44 + i * 8) % 132);
        ctx.fillStyle = i % 3 ? "#476a89" : "#91ffc8";
        ctx.fillRect(138 - tail, 54 + i % 2 * 3, 4, 1);
      }
      sprite.forEach((row, dy) => [...row].forEach((pixel, dx) => {
        if (pixel === "0") return;
        ctx.fillStyle = colors[pixel];
        ctx.fillRect(x + dx * 3, y + dy * 3, 3, 3);
      }));
      const now = new Date();
      if (now.getSeconds() !== second) {
        second = now.getSeconds();
        clock.textContent = format.format(now);
      }
    }
    animateScene(render);
  </script>
</body>
</html>
